dataset:
  unit: MW
  format: isone_smd
  paths:
  - data/raw/isone/2023_smd_hourly.xlsx
  - data/raw/isone/2024_smd_hourly.xlsx
  - data/raw/isone/2025_smd_hourly.xlsx
  target_columns:
  - ME
  - NH
  - VT
  - CT
  - RI
  - SEMA
  - WCMA
  - NEMA
  weather_columns:
  - ME_Dry_Bulb
  - ME_Dew_Point
  - NH_Dry_Bulb
  - NH_Dew_Point
  - VT_Dry_Bulb
  - VT_Dew_Point
  - CT_Dry_Bulb
  - CT_Dew_Point
  - RI_Dry_Bulb
  - RI_Dew_Point
  - SEMA_Dry_Bulb
  - SEMA_Dew_Point
  - WCMA_Dry_Bulb
  - WCMA_Dew_Point
  - NEMA_Dry_Bulb
  - NEMA_Dew_Point
forecast:
  horizon_hours: 24
  lookback_hours: 24
split:
  train_fraction: 0.5
  validation_fraction: 0.1667
features:
  tree_lags:
  - 1
  - 2
  - 3
  - 6
  - 12
  - 24
  rolling_windows:
  - 3
  - 24
  target_weather_proxy: observed_target_weather
  weekly_lags:
  - 144
  - 168
training:
  seed: 42
  batch_size: 64
  epochs: 60
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 10
models:
  random_forest:
    n_estimators: 200
    max_depth: 20
  extra_trees:
    n_estimators: 200
    max_depth: 20
  hist_gradient_boosting:
    max_iter: 200
    max_depth: 10
    learning_rate: 0.05
  lstm:
    hidden_size: 128
    num_layers: 2
    dropout: 0.1
  cross_attention_transformer:
    d_model: 64
    nhead: 4
    num_layers: 2
    dropout: 0.1
  patchtst:
    d_model: 64
    nhead: 4
    num_layers: 2
    patch_length: 4
    stride: 2
    dropout: 0.1
